# Ward-Beck Audio Tap: one core, three build types.
#
#   core/     the Tap itself (Rust crate ward-beck-audio-tab): HTTP API, MXL engine,
#             generators, AES67, SAP/NMOS/PTP/NTP, logging - shared by every OS
#   linux/    PipeWire / PulseAudio build: install.sh, systemd user service, Docker image
#   windows/  Windows build: install.ps1 (per-user, starts at sign-in)
#   macos/    macOS build: install.sh (LaunchAgent)
#
# `cargo build --release` here builds core/ into target/release/.
[workspace]
members = ["core"]
# Submodule crates keep their own workspaces and tests.
exclude = ["PTP", "Generators", "mxl-hands-on"]
resolver = "2"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
