[package]
name = "ward-beck-audio-tab"
version = "2.0.0"
edition = "2021"
description = "WARD BECK TAP: virtual audio patchbay, signal tap, MXL shared-memory engine and AoIP listeners for Linux"
license-file = "LICENSE"
publish = false

[[bin]]
name = "ward-beck-audio-tab"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
signal-hook = "0.3"
ureq = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
