[package]
name = "wbs-aoip"
description = "AoIP listener: SAP / SDP, SIP and the PTP sniffer"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
socket2.workspace = true
libc.workspace = true
apkaudio-ptp.workspace = true
wbs-common.workspace = true
wbs-sys.workspace = true
wbs-log.workspace = true
wbs-net.workspace = true
wbs-plugin.workspace = true
wbs-pyshim.workspace = true
apkaudio-maclookup = { workspace = true, optional = true }

[features]
# Vendor names for PTP clocks (OUI lookup; downloads its table over HTTPS, so it brings rustls/ring).
default = ["vendors"]
vendors = ["dep:apkaudio-maclookup"]
